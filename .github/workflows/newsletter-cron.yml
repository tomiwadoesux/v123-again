name: Send Newsletter Emails

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  send-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Newsletter Cron
        run: |
          curl -X GET "https://v123.ayotomcs.me/api/news/schedule?frequency=scheduled"
          
      - name: Log completion
        run: echo "Newsletter cron triggered successfully"
